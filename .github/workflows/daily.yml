# دَرْب AI — تشغيل مجاني يومي: صورة واحدة من كل كاميرا ← تحليل بالذكاء الاصطناعي ← نشر الموقع على GitHub Pages
# يعمل ظهرًا بالتوقيت المحلي لكل منطقة (الإضاءة الأفضل). البيانات تُحفظ في فرع darb-data.
name: DARB AI — daily analysis

on:
  schedule:
    - cron: "7 4 * * *"    # 12:07 بتوقيت سنغافورة
    - cron: "7 19 * * *"   # 12:07 بتوقيت فينكس (MST)
  workflow_dispatch: {}

permissions:
  contents: write   # حفظ البيانات في فرع darb-data
  pages: write
  id-token: write

concurrency:
  group: darb-ai
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DARB_REGIONS: singapore,phoenix
      DARB_DATA_DIR: ${{ github.workspace }}/darb-state
      DARB_SEED_FRAMES: "3"
      DARB_SITE_MODE: auto
    steps:
      - uses: actions/checkout@v4

      - name: Restore saved data (darb-data branch)
        run: |
          git clone --depth 1 --branch darb-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" darb-state \
            || mkdir -p darb-state
          rm -rf darb-state/.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ai.txt

      - name: Install (PyTorch CPU + AI)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements-ai.txt

      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: models
          key: darb-models-v1

      - name: Download models
        run: python -m backend.models

      - name: Capture one image per camera + analyze + build site
        run: python -m backend.cli daily --site "${{ github.workspace }}/site"

      - name: Save data (single-commit snapshot, keeps the repo small)
        working-directory: darb-state
        run: |
          git init -q -b darb-data
          git config user.name "darb-ai-bot"
          git config user.email "darb-ai-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "DARB AI data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" darb-data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
