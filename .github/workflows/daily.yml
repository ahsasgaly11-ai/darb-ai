# دَرْب AI — تشغيل مجاني: التقاط يومي لكل كاميرا (5–25 إطارًا) ← تحليل بالذكاء الاصطناعي ← نشر الموقع على GitHub Pages
# كل منطقة تُحلَّل مرة يوميًا نهارًا (8–16، والأفضل 9–12) بتوقيتها (ضوء جيد قبل تموّج الهواء من حرارة الأسفلت)،
# وأي اشتباه بحدث مفاجئ يُعاد التقاطه بعد ساعة قبل التنبيه. البيانات تُحفظ في فرع darb-data.
name: DARB AI — daily analysis

on:
  schedule:
    # كل نصف ساعة طوال اليوم: نوافذ النهار (8–16 محليًا) للمناطق الثماني تغطي أغلب ساعات UTC. مجدول GitHub يُسقط
    # أغلب المواعيد (3 من 34 في 21 أكتوبر)، فكل موعد يُطلَق فرصة. خطوة «ماذا نشغّل؟» تنتهي خلال ثوانٍ إن لم يكن هناك عمل.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      cmd:
        description: "daily = التقاط يومي، reanalyze = إعادة تحليل آخر 5 أيام بالقواعد الحالية، now = تحديث فوري لكل كاميرا في ضوء النهار الآن (بعد تعديل الإعدادات)، confirm = تأكيد الاشتباهات"
        type: choice
        options: [daily, now, confirm, reanalyze]
        default: daily

permissions:
  contents: write   # حفظ البيانات في فرع darb-data
  issues: write     # الرد على بلاغات المواطنين وإغلاقها بعد التحقق
  pages: write
  id-token: write

concurrency:
  group: darb-ai
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04  # مثبّت: ubuntu-latest ينتقل إلى Ubuntu 26
    timeout-minutes: 90
    outputs:
      run: ${{ steps.work.outputs.run }}
    env:
      DARB_REGIONS: singapore,phoenix,tucson,yuma,tampa,losangeles,sandiego,madrid
      DARB_DATA_DIR: ${{ github.workspace }}/darb-state
      DARB_SEED_FRAMES: "3"
      DARB_SITE_MODE: auto
    steps:
      - uses: actions/checkout@v5

      - name: Restore saved data (darb-data branch)
        run: |
          git clone --depth 1 --branch darb-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" darb-state \
            || mkdir -p darb-state
          rm -rf darb-state/.git

      - name: Decide what to run
        id: work
        # المكتبة القياسية فقط (قبل تثبيت PyTorch): daily = كاميرات مستحقة الآن، confirm = اشتباه حان تأكيده، none = لا عمل
        run: |
          cmd="${{ inputs.cmd }}"
          [ -z "$cmd" ] && cmd=$(python3 -m backend.cli due || echo daily)  # إن تعذّر الفحص: التشغيل الكامل أسلم
          [ "$cmd" = now ] && cmd="daily --now"
          [ "$cmd" = reanalyze ] && cmd="reanalyze --days 5"
          echo "cmd=$cmd" >> "$GITHUB_OUTPUT"
          if [ "$cmd" = none ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "لا عمل الآن: كل كاميرات المناطق التي في نافذتها التُقطت اليوم، ولا اشتباه للتأكيد"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "التشغيل: $cmd"
          fi

      - if: steps.work.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ai.txt

      - name: Install (PyTorch CPU + AI)
        if: steps.work.outputs.run == 'true'
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements-ai.txt
          # قراءة الساعة المطبوعة على صور ADOT لكشف الصور المتجمدة (اختياري: بدونه لا يُرفض شيء)
          sudo apt-get install -y -qq tesseract-ocr >/dev/null || echo "tesseract unavailable"

      - name: Cache AI models
        if: steps.work.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: models
          key: darb-models-v2   # v2: يشمل نسخ ONNX للمتصفح

      - name: Download models
        if: steps.work.outputs.run == 'true'
        run: |
          pip install onnx onnxslim onnxruntime
          python -m backend.models --onnx

      - name: Capture (5–25 frames per camera) + analyze + build site
        if: steps.work.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m backend.cli ${{ steps.work.outputs.cmd }} --site "${{ github.workspace }}/site"

      - name: Save data (single-commit snapshot, keeps the repo small)
        if: steps.work.outputs.run == 'true'
        working-directory: darb-state
        run: |
          git init -q -b darb-data
          git config user.name "darb-ai-bot"
          git config user.email "darb-ai-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "DARB AI data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" darb-data

      - if: steps.work.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: analyze
    if: needs.analyze.outputs.run == 'true'
    runs-on: ubuntu-24.04  # مثبّت: ubuntu-latest ينتقل إلى Ubuntu 26
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
